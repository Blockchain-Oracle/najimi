server {
  listen 80;
  root /usr/share/nginx/html;
  # Behind the proxy, redirects stay relative (no http:// or :80 leaking into Location).
  absolute_redirect off;
  charset utf-8;
  charset_types text/html text/plain text/markdown text/css application/javascript application/json image/svg+xml;

  # Pages are exported as /docs/agent.html for /docs/agent.
  location / {
    try_files $uri $uri.html $uri/ =404;
  }
  error_page 404 /404.html;

  # The docs used to live at the root: keep every old link (Devpost, the README) working.
  location = /docs { return 301 /docs/guide; }
  location = /guide { return 301 /docs/guide; }
  location = /agent { return 301 /docs/agent; }
  location = /qloo { return 301 /docs/qloo; }
  location = /architecture { return 301 /docs/build; }
  location = /privacy { return 301 /docs/guide/privacy; }

  # Per-page Markdown for "Copy Markdown" and "Open in ChatGPT / Claude".
  location ~ \.md$ {
    default_type text/markdown;
  }
  location ~ ^/llms(-full)?\.txt$ {
    default_type text/plain;
  }
  # The search index is exported without an extension.
  location = /api/search {
    default_type application/json;
  }
  location /og/ {
    add_header Cache-Control "public, max-age=3600";
  }
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
