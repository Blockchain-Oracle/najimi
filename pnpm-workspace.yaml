packages:
  - apps/*
  - packages/*

# Supply-chain guard: never install a version published less than a day ago
# (compromised releases are usually caught and pulled within hours).
minimumReleaseAge: 1440

# Only these packages may run install scripts. next-intl's message-extraction tooling (swc,
# parcel watcher) is never used at runtime, so its native builds are refused.
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: true

# rettiwt-api asks for axios ^1.8.4; hold it at a reviewed release (1.14.1 and 0.30.4 were the
# hijacked ones, 2026-03-31).
overrides:
  axios: 1.20.0

# One version per shared dependency across apps and packages.
catalog:
  typescript: 7.0.2
  "@types/node": 24.19.2
  tsx: 4.23.15
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  next: 16.4.2
  "@tanstack/react-query": 5.104.5
  zod: 4.6.7
  tailwindcss: 4.3.3
  "@tailwindcss/postcss": 4.3.3
  motion: 14.4.0
  drizzle-orm: 0.45.4
  postgres: 3.4.9
  pg-boss: 12.38.0
  better-auth: 1.7.8
  lucide-react: 1.57.0
  ai: 7.0.146
  "@ai-sdk/react": 4.0.150
  sharp: 0.35.5
  next-intl: 4.14.9
