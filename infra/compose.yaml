# Local services. Every port binds to 127.0.0.1 only; the numbers match LOCAL_PORTS in packages/config.
name: najimi

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-najimi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-najimi}
      POSTGRES_DB: ${POSTGRES_DB:-najimi}
    ports:
      - "127.0.0.1:54330:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage (RustFS 1.0, Apache-2.0), private: only the app talks to it.
  s3:
    image: rustfs/rustfs:1.0.1
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-najimi-dev}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-najimi-dev-secret-change-me}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_LOGGER_LEVEL: error
    ports:
      - "127.0.0.1:9300:9000"
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  s3data:
